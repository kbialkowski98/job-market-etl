name: Daily Job Market ETL

on:
  schedule:
    # Codziennie o 3:00 w nocy 
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Pythona 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Magiczny trik: przyspiesza kolejne instalacje bibliotek

      - name: Instalacja zależności (Biblioteki)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Uruchomienie Orkiestratora ETL
        env:
          # Tutaj wstrzykujemy hasła z "sejfu" do wirtualnego systemu
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python -m src.main