name: Daily Job Market ETL

on:
  schedule:
    # Codziennie o 3:00 w nocy
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    env:
      DB_DRIVER: ${{ secrets.DB_DRIVER }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

    defaults:
      run:
        working-directory: ./job_market_etl

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Pythona 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
          pip install dbt-postgres

      - name: Uruchomienie ETL (Pobieranie i Ładowanie)
        run: |
          python -m src.main

      - name: Uruchomienie dbt (seed, modele, testy)
        working-directory: ./dbt_transform
        run: |
          dbt build --profiles-dir .

